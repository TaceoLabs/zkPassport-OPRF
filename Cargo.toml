[workspace]
resolver = "3"
members = [
  "authentication",
  "client",
  "dev-client",
  "node",
]

[workspace.package]
edition = "2024"
rust-version = "1.91"
readme = "./README.md"
homepage = "https://www.taceo.io"
repository = "https://github.com/TaceoLabs/zkpassport-OPRF"
license = "MIT OR Apache-2.0"
publish = false

[workspace.dependencies]
alloy = { version = "2", default-features = false }
ark-babyjubjub = { package = "taceo-ark-babyjubjub", version = "0.5.3" }
ark-ff = "0.5"
ark-serialize = "0.5"
axum = "0.8"
clap = "4"
config = { version = "0.15", default-features = false }
eyre = { version = "0.6" }
metrics = "0.24"
rand = { version = "0.8" }
reqwest = { version = "0.13", default-features = false }
rustls = "0.23"
serde = { version = "1" }
serde_json = { version = "1" }
taceo-nodes-common = { version = "0.7.3", default-features = false }
taceo-oprf = { package = "taceo-oprf", version = "0.16" }
telemetry-batteries = { version = "0.2.1", default-features = false }
thiserror = { version = "2" }
tikv-jemallocator = "0.7"
tokio = { version = "1" }
tokio-util = "0.7"
tracing = { version = "0.1" }
tracing-subscriber = { version = "0.3" }
uuid = { version = "1" }

[profile.release]
lto = true
codegen-units = 1

# This profile can be used for CI in pull requests.
[profile.ci-dev]
inherits = "dev"
opt-level = 1
debug = true
incremental = false

[profile.profiling]
inherits = "bench"
debug = true
lto = "thin"
