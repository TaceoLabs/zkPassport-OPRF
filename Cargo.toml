[workspace]
resolver = "3"
members = ["authentication", "dev-client", "node", "test-utils"]

[workspace.package]
edition = "2024"
rust-version = "1.94.1"
readme = "./README.md"
homepage = "https://www.taceo.io"
repository = "https://github.com/TaceoLabs/zkpassport-OPRF"
license = "MIT OR Apache-2.0"
publish = false

[workspace.dependencies]
ark-babyjubjub = { package = "taceo-ark-babyjubjub", version = "0.6" }
ark-ec = "0.6"
ark-ff = "0.6"
ark-serde-compat = { package = "taceo-ark-serde-compat", version = "0.6.1", default-features = false }
ark-serialize = "0.6"
axum = "0.8.9"
backon = { version = "1.6", default-features = false }
clap = "4"
config = { version = "0.15", default-features = false }
eyre = { version = "0.6" }
jiff = { version = "1.0", default-features = false, features = ["serde", "std"] }
metrics = "0.24"
reqwest = { version = "0.13", default-features = false }
ruint = "1.18.0"
rustls = "0.23"
serde = { version = "1" }
serde_json = { version = "1" }
sqlx = { version = "0.9" }
taceo-oprf = { version = "0.22", default-features = false }
telemetry-batteries = { version = "0.4.1", default-features = false }
thiserror = { version = "2" }
tikv-jemallocator = "0.7"
tokio = { version = "1" }
tower-http = { version = "0.7", default-features = false }
tracing = { version = "0.1" }
tracing-subscriber = { version = "0.3" }
url = "2"
uuid = { version = "1" }
webpki-roots = "1"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
allow_attributes_without_reason = "deny"
assertions_on_result_states = "deny"
dbg_macro = "deny"
decimal_literal_representation = "deny"
exhaustive_enums = "deny"
iter_over_hash_type = "deny"
let_underscore_must_use = "deny"
missing_assert_message = "deny"
pedantic = { level = "deny", priority = -1 }
print_stderr = "deny"
print_stdout = "deny"
undocumented_unsafe_blocks = "deny"
unnecessary_safety_comment = "deny"
unwrap_used = "deny"

[workspace.lints.rust]
missing_docs = "deny"

# This profile can be used for CI in pull requests.
[profile.ci-dev]
inherits = "dev"
opt-level = 1
debug = true
incremental = false

# This profile should be used for final build in the docker image.
# cargo build --profile dist
[profile.dist]
inherits = "release"
lto = true
codegen-units = 1

[profile.profiling]
inherits = "bench"
debug = true
lto = "thin"
