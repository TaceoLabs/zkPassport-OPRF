[package]
name = "taceo-zkpassport-dev-client"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
description = "Dev-Client for zkPassport instance of TACEO:OPRF. Runs the end-to-end test and smoke tests against local and deployed nodes."
readme.workspace = true
homepage.workspace = true
repository.workspace = true
license.workspace = true
keywords = ["cryptography", "mpc", "oprf"]
publish.workspace = true

[dependencies]
clap = { workspace = true, features = ["derive", "env"] }
eyre.workspace = true
reqwest = { workspace = true, features = ["default-tls", "json"] }
ruint.workspace = true
rustls.workspace = true
taceo-oprf = { workspace = true, features = ["client", "types"] }
tokio = { workspace = true, features = [
  "macros",
  "rt-multi-thread",
  "sync",
  "time",
] }
tracing.workspace = true
tracing-subscriber = { workspace = true, features = [
  "env-filter",
  "fmt",
] }
zkpassport-oprf-authentication = { package = "taceo-zkpassport-oprf-authentication", path = "../authentication", version = "0.1" }
zkpassport-oprf-test-utils = { package = "taceo-zkpassport-oprf-test-utils", path = "../test-utils", version = "0.1" }

[lints]
