[package]
name = "taceo-zkpassport-dev-client"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
description = "Dev-Client for zkPassport instance of TACEO:OPRF. Used for testing."
readme.workspace = true
homepage.workspace = true
repository.workspace = true
license.workspace = true
keywords = ["cryptography", "mpc", "oprf"]
publish.workspace = true

[dependencies]
alloy = { workspace = true, features = ["full", "rpc", "rpc-client-ws"] }
clap = { workspace = true, features = ["derive", "env"] }
eyre.workspace = true
rand.workspace = true
rustls.workspace = true
taceo-oprf = { workspace = true, features = ["dev-client"] }
tokio = { workspace = true, features = [
  "net",
  "rt-multi-thread",
  "signal",
  "sync",
  "time",
  "tokio-macros",
] }
tracing.workspace = true
tracing-subscriber = {workspace = true, features = [
  "env-filter",
  "fmt",
]}
uuid = { workspace = true, features = ["serde", "v4"] }
zkpassport-oprf-authentication = { package = "taceo-zkpassport-oprf-authentication", path = "../authentication", version = "0.1" }
zkpassport-oprf-client = { package = "taceo-zkpassport-oprf-client", path = "../client", version = "0.1" }
zkpassport-oprf-test-utils = { package = "taceo-zkpassport-oprf-test-utils", path = "../test-utils", version = "0.1" }
