[workspace]
git_only = true
publish = false
release_always = false
release_commits = "^(feat|fix|perf|refactor|build|revert|doc|chore: update Cargo\\.(toml|lock) dependencies)"
# Only the node produces a deployable artifact, so it is the only crate with a GitHub release.
git_release_enable = false
git_tag_name = "{{ package }}-v{{ version }}"
git_release_name = "{{ package }}-v{{ version }}"

[[package]]
name = "taceo-zkpassport-oprf-node"
git_release_enable = true

[[package]]
name = "taceo-zkpassport-dev-client"
semver_check = false  # bin-only crate, cargo-semver-checks is lib-only

[changelog]
header = "# Changelog"

body = """

{% macro print_commit(commit) -%}
    - {% if commit.scope %}*({{ commit.scope }})* {% endif %}\
      {% if commit.breaking %}[**breaking**] {% endif %}\
      {{ commit.message | upper_first }} - \
      ([{{ commit.id | truncate(length=7, end="") }}]({{ remote.link }}/commit/{{ commit.id }}))\
{% endmacro -%}

{% if version %}\
    {% if previous.version %}\
        ## [{{ version }}]({{ release_link }})
    {% else %}\
        ## [{{ version }}]
    {% endif %}\
{% endif %}\

{% for group, commits in commits
| filter(attribute="merge_commit", value=false)
| group_by(attribute="group") %}
    ### {{ group | striptags | trim | upper_first }}

    {% for commit in commits
    | filter(attribute="scope")
    | sort(attribute="scope") %}
        {{ self::print_commit(commit=commit) }}
    {%- endfor -%}
    {% raw %}\n{% endraw %}\
    {%- for commit in commits %}
        {%- if not commit.scope -%}
            {{ self::print_commit(commit=commit) }}
        {% endif -%}
    {% endfor -%}
{% endfor %}\n
"""

commit_parsers = [
  { message = "^feat", group = "<!-- 00 -->⛰️ Features" },
  { message = "^fix", group = "<!-- 01 -->🐛 Bug Fixes" },
  { message = "^refactor", group = "<!-- 02 -->🚜 Refactor" },
  { message = "^build", group = "<!-- 03 -->🏗️ Build" },
  { message = "^doc", group = "<!-- 04 -->📚 Documentation" },
  { message = "^perf", group = "<!-- 05 -->⚡ Performance" },
  { message = "^style", group = "<!-- 06 -->🎨 Styling" },
  { message = "^test", group = "<!-- 07 -->🧪 Testing" },
  { body = ".*security", group = "<!-- 08 -->🛡️ Security" },
  { message = "^revert", group = "<!-- 09 -->◀️ Revert" },
  { message = "^ci", skip = true },
  { message = "^chore: update Cargo\\.(toml|lock) dependencies", group = "<!-- 03 -->🏗️ Build" },
  { message = "^chore: release", skip = true },
  # Catches remaining `chore:` commits (including release-plz's synthetic one for packages pulled
  # forward by a local path dependency release) and anything else non-conventional.
  { message = ".*", group = "<!-- 10 -->🌀 Other" },
]

link_parsers = [
  { pattern = "#(\\d+)", href = "{{ remote.link }}/issues/$1" },
  { pattern = "RFC(\\d+)", text = "ietf-rfc$1", href = "https://datatracker.ietf.org/doc/html/rfc$1" },
]
